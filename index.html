<title>Mon Budget</title>
<style>
:root{--bg:#f2f2f7;--card:#fff;--tx:#111114;--mut:#6c6c74;--line:#e2e2e8;--acc:#2f6fed;--ok:#1f9d55;--warn:#e08600;--bad:#d64545;--soft:#ebebf0;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#000;--card:#1c1c1e;--tx:#f2f2f7;--mut:#9b9ba3;--line:#2e2e31;--acc:#5b8cff;--ok:#2fb866;--warn:#f59a12;--bad:#f05252;--soft:#2c2c2e}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-text-size-adjust:100%}
body{padding:env(safe-area-inset-top) 0 calc(92px + env(safe-area-inset-bottom));overscroll-behavior-y:none}
main{max-width:560px;margin:0 auto;padding:10px 16px}
h1{font-size:28px;margin:8px 0 4px}h2{font-size:18px;margin:0 0 10px}
button,input,select{font:inherit;color:inherit}
.card{background:var(--card);border-radius:18px;padding:16px;margin:12px 0}
.mut{color:var(--mut)}.sm{font-size:13px}.r{text-align:right}
.hero{color:#fff;border-radius:22px;padding:18px 18px 16px;margin-top:8px}
.hero.ok{background:var(--ok)}.hero.warn{background:var(--warn)}.hero.bad{background:var(--bad)}
.hero .lbl{font-size:14px;opacity:.9}
.big{font-size:54px;font-weight:800;letter-spacing:-1.5px;line-height:1.05;margin:2px 0 10px;font-variant-numeric:tabular-nums}
.row2{display:flex;gap:10px}
.row2>div{flex:1;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px}
.row2 b{display:block;font-size:28px;font-variant-numeric:tabular-nums}
.hero .cap{font-size:13px;opacity:.92;margin-top:10px}
.alert{border-radius:14px;padding:12px 14px;margin:8px 0;font-size:15px;background:var(--card);border-left:5px solid var(--warn)}
.alert.bad{border-left-color:var(--bad)}.alert.info{border-left-color:var(--acc)}
.env{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line)}
.env:last-child{border-bottom:0}
.env .e{font-size:26px;width:34px;text-align:center}
.env .m{flex:1;min-width:0}
.env .t{display:flex;justify-content:space-between;font-size:15px}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;border-radius:6px;background:var(--ok)}
.bar i.w{background:var(--warn)}.bar i.b{background:var(--bad)}
.goalbar{height:16px}.goalbar i{background:var(--acc)}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}.li .e{font-size:22px;width:30px;text-align:center}.li .m{flex:1;min-width:0}
.li .m div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt-neg{font-variant-numeric:tabular-nums;font-weight:600}.amt-pos{color:var(--ok);font-weight:600;font-variant-numeric:tabular-nums}
.day{font-size:13px;color:var(--mut);margin:14px 0 2px;text-transform:capitalize}
nav.tabs{position:fixed;z-index:5;bottom:0;left:0;right:0;display:flex;justify-content:space-around;align-items:flex-end;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(8px + env(safe-area-inset-bottom))}
nav button{flex:1;background:none;border:0;color:var(--mut);font-size:12px;padding:4px 0}
nav button span{display:block;font-size:25px;line-height:1.2}
nav button.on{color:var(--acc);font-weight:600}
nav .plus{flex:0 0 74px;height:74px;border-radius:50%;background:var(--acc);color:#fff;font-size:44px;font-weight:300;margin:-34px 6px 0;box-shadow:0 6px 20px rgba(0,0,0,.28);line-height:1}
.sheet{position:fixed;inset:0;z-index:10;background:var(--bg);overflow-y:auto;padding:calc(env(safe-area-inset-top) + 8px) 16px calc(16px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.4}to{transform:none;opacity:1}}
.hidden{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--soft);font-size:20px}
.seg{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.seg button{border:0;background:none;padding:8px 14px;border-radius:9px;font-size:15px}
.seg button.on{background:var(--card);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.addwrap{max-width:520px;margin:0 auto;display:flex;flex-direction:column;min-height:100%}
.amt{font-size:56px;font-weight:800;text-align:center;margin:10px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:-1px}
.amt.shake{animation:sh .3s}@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.note{width:100%;border:0;background:var(--card);border-radius:12px;padding:11px 14px;font-size:16px;margin:6px 0 10px}
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.cats button{border:0;background:var(--card);border-radius:16px;padding:8px 4px;min-height:66px;font-size:12.5px;line-height:1.15}
.cats button span{display:block;font-size:28px;margin-bottom:2px}
.cats button:active,.pad button:active{transform:scale(.95);background:var(--soft)}
.cats button.sel{outline:3px solid var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.pad button{border:0;background:var(--card);border-radius:14px;height:56px;font-size:26px;font-weight:500}
.datechip{border:0;background:var(--soft);border-radius:10px;padding:8px 8px;font-size:14px;max-width:150px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:15px;font-size:17px;font-weight:600;background:var(--acc);color:#fff;margin:8px 0}
.btn.sec{background:var(--soft);color:var(--tx)}.btn.danger{background:none;color:var(--bad)}
.monthnav{display:flex;align-items:center;justify-content:space-between}
.monthnav button{width:48px;height:48px;border:0;border-radius:50%;background:var(--card);font-size:22px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kpis div{background:var(--card);border-radius:14px;padding:10px}.kpis b{display:block;font-size:18px;font-variant-numeric:tabular-nums}
.delta{font-size:12px;font-weight:600}.up{color:var(--bad)}.dn{color:var(--ok)}
details.card summary{font-weight:700;font-size:17px;list-style:none;cursor:pointer}
details.card summary::-webkit-details-marker{display:none}
details.card summary::after{content:"›";float:right;transform:rotate(90deg);color:var(--mut)}
details[open].card summary::after{transform:rotate(-90deg)}
.f{display:flex;gap:8px;align-items:center;margin:8px 0}
.f label{flex:1;font-size:15px}
.in{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-size:16px;min-width:0}
.in.n{width:96px;text-align:right}.in.e{width:52px;text-align:center;font-size:20px;padding:6px}.in.d{width:64px;text-align:center}
.item{border:1px solid var(--line);border-radius:14px;padding:10px;margin:8px 0}
.item .f{margin:6px 0}
.del{border:0;background:none;font-size:20px;padding:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:0;background:var(--card);border-radius:20px;padding:8px 12px;font-size:15px}
.chips button.sel{background:var(--acc);color:#fff}
#toast{position:fixed;z-index:20;left:16px;right:16px;bottom:calc(100px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;background:#222;color:#fff;border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;align-items:center;font-size:15px;box-shadow:0 6px 20px rgba(0,0,0,.3)}
#toast button{background:none;border:0;color:#7fb0ff;font-weight:700;font-size:15px}
.welcome{text-align:center;padding-top:40px}.welcome .logo{font-size:64px}
</style>
</head>
<body>
<main id="view"></main>
<nav class="tabs" id="tabs">
  <button data-t="home" class="on"><span>🏠</span>Accueil</button>
  <button data-t="hist"><span>📊</span>Historique</button>
  <button class="plus" id="plusBtn" aria-label="Ajouter une dépense">+</button>
  <button data-t="fix"><span>🔁</span>Charges</button>
  <button data-t="set"><span>⚙️</span>Réglages</button>
</nav>
<div id="sheet" class="sheet hidden"></div>
<div id="toast" class="hidden"></div>
<input type="file" id="fileBank" accept=".csv,.xlsx,.xls,text/csv" class="hidden">
<input type="file" id="fileJson" accept=".json,application/json" class="hidden">
<script>
"use strict";
/* ============ Données & stockage ============ */
const KEY='monbudget-v1';
const DEFAULT_CATS=[
 {id:'courses',name:'Courses',emoji:'🛒',group:'var',budget:170},
 {id:'transport',name:'Transport',emoji:'🚗',group:'var',budget:200},
 {id:'restos',name:'Restos & livraison',emoji:'🍔',group:'var',budget:130},
 {id:'bars',name:'Bars & sorties',emoji:'🍻',group:'var',budget:100},
 {id:'shopping',name:'Shopping',emoji:'🛍️',group:'var',budget:60},
 {id:'cafe',name:'Café & vape',emoji:'☕',group:'var',budget:35},
 {id:'sante',name:'Santé & soins',emoji:'💊',group:'var',budget:30},
 {id:'loisirs',name:'Loisirs',emoji:'🎮',group:'var',budget:25},
 {id:'divers',name:'Divers & cadeaux',emoji:'📦',group:'var',budget:50},
 {id:'logement',name:'Logement & énergie',emoji:'🏠',group:'fix',budget:0},
 {id:'abonnements',name:'Abonnements',emoji:'📱',group:'fix',budget:0},
 {id:'assurances',name:'Assurances',emoji:'🛡️',group:'fix',budget:0},
 {id:'banque',name:'Frais bancaires',emoji:'🏦',group:'fix',budget:0},
 {id:'impots',name:'Impôts',emoji:'🧾',group:'fix',budget:0},
 {id:'credit',name:'Crédit',emoji:'💳',group:'fix',budget:0},
 {id:'epargne',name:'Épargne',emoji:'🐷',group:'epargne',budget:0},
 {id:'av',name:'Assurance-vie',emoji:'🌱',group:'epargne',budget:0},
 {id:'revenus',name:'Revenus',emoji:'💶',group:'revenu',budget:0},
 {id:'interne',name:'Virement entre comptes',emoji:'↔️',group:'ignore',budget:0},
 {id:'exceptionnel',name:'Exceptionnel',emoji:'⭐',group:'ignore',budget:0}
];
const GROUPS={var:'Enveloppe (dépense variable)',fix:'Charge fixe',epargne:'Épargne',revenu:'Revenu',ignore:'Ignoré (hors budget)'};
function freshState(){return{v:1,settings:{income:2000,overdraft:400,payDays:{},payDefault:27,salaryKw:'',balance:null,fixedFrom:today()},cats:JSON.parse(JSON.stringify(DEFAULT_CATS)),fixed:[{id:'f_ep',name:'Épargne (virement auto)',amount:50,freq:'p',cat:'epargne',kw:'',tol:.05}],goal:{name:'Coussin de sécurité',target:600,start:0,since:today()},tx:[],rules:{}}}
let S=null;
function load(){try{const r=localStorage.getItem(KEY);if(r)S=JSON.parse(r)}catch(e){S=null}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){alert("Impossible d'enregistrer sur le téléphone : "+e.message)}}

/* ============ Utilitaires ============ */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const NF2=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'});
const NF0=new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR',maximumFractionDigits:0});
const eur=n=>NF2.format(n||0), eur0=n=>NF0.format(Math.round(n||0));
const pad=n=>String(n).padStart(2,'0');
const ds=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const addD=(s,n)=>{const d=pd(s);d.setDate(d.getDate()+n);return ds(d)};
const diffD=(a,b)=>Math.round((pd(a)-pd(b))/864e5);
function today(){return ds(new Date())}
const dim=(y,m)=>new Date(y,m,0).getDate();
const MOIS=['janvier','février','mars','avril','mai','juin','juillet','août','septembre','octobre','novembre','décembre'];
const MC=['janv.','févr.','mars','avr.','mai','juin','juil.','août','sept.','oct.','nov.','déc.'];
const fdate=s=>{const d=pd(s);return d.getDate()+' '+MC[d.getMonth()]};
const fday=s=>pd(s).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long'});
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const num=v=>{const n=parseFloat(String(v).replace(/\s| /g,'').replace(',','.'));return isNaN(n)?0:n};
const cat=id=>S.cats.find(c=>c.id===id)||{id,name:id,emoji:'❔',group:'var',budget:0};
const grp=id=>cat(id).group;

/* ============ Cycles de paie ============ */
function payDate(y,m){let d=S.settings.payDays[y+'-'+pad(m)];if(d==null||d==='')d=S.settings.payDefault;d=Math.min(+d,dim(y,m));return y+'-'+pad(m)+'-'+pad(d)}
function cycleOf(s){const[y,m]=s.split('-').map(Number);const p=payDate(y,m);
 if(s>=p){const n=m===12?[y+1,1]:[y,m+1];return{start:p,end:addD(payDate(n[0],n[1]),-1)}}
 const pr=m===1?[y-1,12]:[y,m-1];return{start:payDate(pr[0],pr[1]),end:addD(p,-1)}}

/* ============ Charges fixes : échéances ============ */
function items(){const a=S.fixed.slice();if(S.settings.income>0)a.push({id:'__paie',name:'Salaire',amount:+S.settings.income,freq:'p',cat:'revenus',kw:S.settings.salaryKw,tol:.6});return a}
const sgn=it=>grp(it.cat)==='revenu'?1:-1;
function occOf(it,from,to){const out=[];if(from>to)return out;
 if(it.freq==='w'){let d=from;for(let k=0;k<400&&d<=to;k++){if(pd(d).getDay()===+it.wday)out.push(d);d=addD(d,1)}return out}
 let[y,m]=from.split('-').map(Number);const[ty,tm]=to.split('-').map(Number);
 while(y<ty||(y===ty&&m<=tm)){const d=it.freq==='p'?payDate(y,m):y+'-'+pad(m)+'-'+pad(Math.min(+it.day||1,dim(y,m)));if(d>=from&&d<=to)out.push(d);if(++m>12){m=1;y++}}
 return out}
function linkIndex(){const ix={};for(const t of S.tx)if(t.f)(ix[t.f]=ix[t.f]||[]).push(t.d);return ix}
function planned(from,to,ix){ix=ix||linkIndex();from=from<S.settings.fixedFrom?S.settings.fixedFrom:from;const out=[];
 for(const it of items()){const win=it.freq==='w'?3:7;for(const d of occOf(it,from,to)){const m=(ix[it.id]||[]).some(x=>Math.abs(diffD(x,d))<=win);out.push({it,d,amt:sgn(it)*it.amount,matched:m})}}
 return out.sort((a,b)=>a.d<b.d?-1:1)}
function linkTx(t){if(t.f&&!S.fixed.concat(items()).some(i=>i.id===t.f))delete t.f;
 const L=((t.l||'')+' '+(t.x||'')).toUpperCase();let best=null;
 for(const it of items()){if(!it.kw||!L.includes(it.kw.toUpperCase()))continue;if(Math.sign(t.a)!==sgn(it))continue;
  const diff=Math.abs(Math.abs(t.a)-it.amount);if(diff>Math.max(it.amount*(it.tol??.4),.5))continue;
  const occ=occOf(it,addD(t.d,-7),addD(t.d,7));if(!occ.length)continue;
  const dd=Math.min(...occ.map(o=>Math.abs(diffD(o,t.d))));if(it.freq==='w'&&dd>3)continue;
  const sc=diff/it.amount+dd/30;if(!best||sc<best.s)best={it,s:sc}}
 if(best){t.f=best.it.id;if(!t.uc)t.c=best.it.cat}}
function relinkAll(){for(const t of S.tx)if(t.s==='b')linkTx(t)}

/* ============ Calculs ============ */
function balanceNow(ix){const B=S.settings.balance;if(!B)return null;let b=+B.amount;
 for(const t of S.tx)if(t.d>B.date||(t.d===B.date&&(t.ts||0)>B.ts))b+=t.a;
 const T=today();for(const o of planned(addD(B.date,1),T,ix))if(!o.matched)b+=o.amt;return b}
function stats(c,ix){ix=ix||linkIndex();const T=today();
 const r={c,inc:0,fix:0,sav:0,vr:0,byCat:{},upFix:0,upSav:0,upInc:0,upcoming:[]};
 for(const t of S.tx){if(t.d<c.start||t.d>c.end)continue;const g=grp(t.c);if(g==='ignore')continue;
  if(g==='revenu')r.inc+=t.a;else if(g==='fix')r.fix-=t.a;else if(g==='epargne')r.sav-=t.a;else{r.vr-=t.a;r.byCat[t.c]=(r.byCat[t.c]||0)-t.a}}
 for(const o of planned(c.start,c.end,ix)){if(o.matched)continue;const g=grp(o.it.cat),fut=o.d>T;
  if(fut)r.upcoming.push(o);
  if(g==='revenu'){r.inc+=o.amt;if(fut)r.upInc+=o.amt}else if(g==='epargne'){r.sav-=o.amt;if(fut)r.upSav-=o.amt}else{r.fix-=o.amt;if(fut)r.upFix-=o.amt}}
 r.R=r.inc-r.fix-r.sav-r.vr;
 r.bal=balanceNow(ix);r.avail=r.bal==null?null:r.bal-r.upFix-r.upSav+r.upInc;
 r.left=r.avail==null?r.R:Math.min(r.R,r.avail);r.limitedByBal=r.avail!=null&&r.avail<r.R;
 r.daysLeft=Math.max(1,diffD(c.end,T)+1);r.elapsed=Math.max(1,diffD(T,c.start)+1);r.days=diffD(c.end,c.start)+1;
 r.pace=r.vr/r.elapsed;r.dayBudget=r.left/r.daysLeft;
 r.projEnd=(r.avail==null?r.R:r.avail)-r.pace*(r.daysLeft-1);
 r.envTotal=S.cats.filter(x=>x.group==='var').reduce((s,x)=>s+(+x.budget||0),0);
 return r}
function goalSaved(ix){const g=S.goal;let s=+g.start||0;const T=today();
 for(const t of S.tx)if(t.c==='epargne'&&t.d>=g.since)s-=t.a;
 for(const o of planned(g.since,T,ix))if(!o.matched&&o.it.cat==='epargne')s-=o.amt;return s}

/* ============ Navigation ============ */
let tab='home',histMonth=null;
document.querySelectorAll('nav button[data-t]').forEach(b=>b.onclick=()=>{tab=b.dataset.t;render();scrollTo(0,0)});
$('#plusBtn').onclick=()=>openAdd();
function render(){document.querySelectorAll('nav button[data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));
 if(!S){$('#tabs').classList.add('hidden');return renderWelcome()}$('#tabs').classList.remove('hidden');
 ({home:renderHome,hist:renderHist,fix:renderFixed,set:renderSettings})[tab]()}

/* ============ Accueil ============ */
function renderWelcome(){$('#view').innerHTML=`<div class="welcome"><div class="logo">💶</div><h1>Mon Budget</h1>
 <p class="mut">Tes données restent sur ce téléphone. Aucun compte, fonctionne hors ligne.</p>
 <button class="btn" id="wStart">📥 Charger mon fichier de départ</button>
 <p class="sm mut">Le fichier <b>budget-depart.json</b> enregistré dans Fichiers.</p>
 <button class="btn sec" id="wEmpty">Commencer sans fichier</button></div>`;
 $('#wStart').onclick=()=>$('#fileJson').click();
 $('#wEmpty').onclick=()=>{S=freshState();save();render()}}
function renderHome(){const ix=linkIndex(),T=today(),c=cycleOf(T),r=stats(c,ix);
 const envs=S.cats.filter(x=>x.group==='var');
 const alerts=[];let maxPct=0;
 for(const e of envs){const sp=r.byCat[e.id]||0,b=+e.budget||0;if(!b)continue;const p=sp/b;maxPct=Math.max(maxPct,p);
  if(p>=1)alerts.push({k:'bad',t:`${e.emoji} ${esc(e.name)} : enveloppe dépassée de ${eur0(sp-b)}`});
  else if(p>=.8)alerts.push({k:'',t:`${e.emoji} ${esc(e.name)} : ${Math.round(p*100)} % utilisé (reste ${eur0(b-sp)})`})}
 const od=+S.settings.overdraft||0;
 if(r.left<=0)alerts.unshift({k:'bad',t:`🚨 Plus rien à dépenser jusqu'au ${fdate(c.end)}. Chaque dépense te rapproche du découvert.`});
 else if(r.projEnd<0)alerts.unshift({k:'bad',t:`⚠️ À ce rythme (${eur0(r.pace)}/jour), tu seras à <b>${eur0(r.projEnd)}</b> le ${fdate(c.end)}${r.projEnd<-od?` — au-delà de ton découvert autorisé (${eur0(od)})`:''}. Vise ${eur0(Math.max(0,r.dayBudget))}/jour.`});
 const soon=r.upcoming.filter(o=>diffD(o.d,T)<=3&&grp(o.it.cat)!=='revenu');
 if(soon.length)alerts.push({k:'info',t:`🔁 Bientôt prélevé : `+soon.map(o=>`${esc(o.it.name)} ${eur(o.it.amount)} (${fdate(o.d)})`).join(', ')});
 const normalDay=r.envTotal/r.days;
 let st='ok';if(r.left<=0||r.projEnd<0)st='bad';else if(maxPct>=.8||r.dayBudget<normalDay*.7)st='warn';
 const cap=r.limitedByBal?`Limité par ton solde : ${eur0(r.bal)} − ${eur0(r.upFix+r.upSav)} de prélèvements à venir`:`Revenus ${eur0(r.inc)} − charges ${eur0(r.fix)} − épargne ${eur0(r.sav)} − dépensé ${eur0(r.vr)}`;
 const gs=goalSaved(ix),g=S.goal,gp=Math.min(1,gs/(+g.target||1));
 const ep=S.fixed.filter(f=>f.cat==='epargne').reduce((s,f)=>s+(+f.amount||0),0);
 const mLeft=ep>0?Math.ceil(Math.max(0,g.target-gs)/ep):null;
 $('#view').innerHTML=`
 <div class="hero ${st}"><div class="lbl">Reste à dépenser jusqu'au ${fdate(c.end)}</div>
  <div class="big">${eur0(r.left)}</div>
  <div class="row2"><div><span class="lbl">Budget du jour</span><b>${eur0(Math.max(0,r.dayBudget))}</b></div><div><span class="lbl">Jours restants</span><b>${r.daysLeft}</b></div></div>
  <div class="cap">${cap}</div></div>
 ${alerts.map(a=>`<div class="alert ${a.k}">${a.t}</div>`).join('')}
 <div class="card"><h2>Enveloppes</h2>${envs.map(e=>{const sp=r.byCat[e.id]||0,b=+e.budget||0,p=b?sp/b:(sp>0?1:0);
  return`<div class="env"><div class="e">${e.emoji}</div><div class="m"><div class="t"><span>${esc(e.name)}</span><span><b>${eur0(sp)}</b> <span class="mut">/ ${eur0(b)}</span></span></div>
  <div class="bar"><i class="${p>=1?'b':p>=.8?'w':''}" style="width:${Math.min(100,p*100)}%"></i></div></div></div>`}).join('')}</div>
 <div class="card"><h2>🎯 ${esc(g.name)}</h2><div class="t" style="display:flex;justify-content:space-between"><b>${eur0(gs)}</b><span class="mut">objectif ${eur0(g.target)}</span></div>
  <div class="bar goalbar"><i style="width:${gp*100}%"></i></div>
  <div class="sm mut" style="margin-top:6px">${gs>=g.target?'Objectif atteint 🎉':mLeft!=null?`${eur0(ep)} mis de côté le jour de la paie · encore ${mLeft} mois`:'Ajoute une charge « Épargne » pour l\'alimenter'}</div></div>
 <div class="card"><h2>Prochains prélèvements</h2>${r.upcoming.filter(o=>grp(o.it.cat)!=='revenu').slice(0,6).map(o=>`<div class="li"><div class="e">${cat(o.it.cat).emoji}</div><div class="m"><div>${esc(o.it.name)}</div><div class="sm mut">${fday(o.d)}</div></div><div class="amt-neg">${eur(o.it.amount)}</div></div>`).join('')||'<div class="mut">Rien d\'ici la prochaine paie.</div>'}
 <div class="sm mut" style="margin-top:8px">Prochaine paie : ${fday(addD(c.end,1))}</div></div>`}

/* ============ Ajout rapide ============ */
let lastAdded=null;
function openAdd(){let buf='',inc=false,more=false,d=today();const sh=$('#sheet');
 const draw=()=>{const list=inc?S.cats.filter(c=>c.group!=='var').sort((a,b)=>(b.group==='revenu')-(a.group==='revenu')):more?S.cats.filter(c=>c.group!=='var'):S.cats.filter(c=>c.group==='var');
  sh.innerHTML=`<div class="addwrap"><div class="top"><button class="x" data-a="close">✕</button>
   <div class="seg"><button class="${inc?'':'on'}" data-a="dep">Dépense</button><button class="${inc?'on':''}" data-a="inc">Revenu</button></div>
   <input type="date" class="datechip" id="addDate" value="${d}"></div>
   <div class="amt" id="amtv">${inc?'+':''}${buf?buf.replace('.',','):'0'} €</div>
   <input class="note" id="addNote" placeholder="Note (facultatif)" autocomplete="off">
   <div class="cats">${list.map(c=>`<button data-c="${c.id}"><span>${c.emoji}</span>${esc(c.name)}</button>`).join('')}
   ${inc?'':`<button data-a="more"><span>${more?'↩️':'⋯'}</span>${more?'Enveloppes':'Autres'}</button>`}</div>
   <div class="pad">${['1','2','3','4','5','6','7','8','9',',','0','⌫'].map(k=>`<button data-k="${k}">${k}</button>`).join('')}</div></div>`;};
 const upd=()=>{$('#amtv').textContent=(inc?'+':'')+(buf?buf.replace('.',','):'0')+' €'};
 draw();sh.classList.remove('hidden');document.body.style.overflow='hidden';
 sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;const k=b.dataset.k,a=b.dataset.a,c=b.dataset.c;
  if(k){if(k==='⌫')buf=buf.slice(0,-1);else if(k===','){if(!buf.includes('.'))buf=(buf||'0')+'.'}else{if(/\.\d\d$/.test(buf)||buf.replace('.','').length>=7)return;buf=(buf==='0'?'':buf)+k}upd();return}
  if(a==='close')return closeSheet();
  if(a==='dep'||a==='inc'){const note=$('#addNote').value;d=$('#addDate').value||d;inc=a==='inc';more=false;draw();$('#addNote').value=note;return}
  if(a==='more'){const note=$('#addNote').value;d=$('#addDate').value||d;more=!more;draw();$('#addNote').value=note;return}
  if(c){const v=num(buf);if(!(v>0)){const el=$('#amtv');el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');return}
   const t={id:uid(),d:$('#addDate').value||today(),a:Math.round((inc?v:-v)*100)/100,c,s:'m',ts:Date.now()};const n=$('#addNote').value.trim();if(n)t.n=n;
   S.tx.push(t);save();lastAdded=t.id;closeSheet();render();
   toast(`✓ ${eur(Math.abs(t.a))} · ${cat(c).emoji} ${cat(c).name}`,'Annuler',()=>{S.tx=S.tx.filter(x=>x.id!==lastAdded);save();render()})}}}
function closeSheet(){const sh=$('#sheet');sh.classList.add('hidden');sh.innerHTML='';sh.onclick=null;document.body.style.overflow=''}
let toastT;function toast(msg,act,fn){const t=$('#toast');t.innerHTML=`<span>${esc(msg)}</span>${act?`<button>${act}</button>`:''}`;t.classList.remove('hidden');
 if(act)t.querySelector('button').onclick=()=>{fn();t.classList.add('hidden')};clearTimeout(toastT);toastT=setTimeout(()=>t.classList.add('hidden'),4500)}

/* ============ Historique ============ */
function monthData(ym,ix){const[y,m]=ym.split('-').map(Number);const from=ym+'-01',to=ym+'-'+pad(dim(y,m)),T=today();
 const ops=S.tx.filter(t=>t.d>=from&&t.d<=to).map(t=>({t,d:t.d,a:t.a,c:t.c}));
 for(const o of planned(from,to<T?to:T,ix))if(!o.matched)ops.push({auto:o,d:o.d,a:o.amt,c:o.it.cat});
 const by={};let inc=0,dep=0,sav=0;
 for(const o of ops){const g=grp(o.c);if(g==='ignore')continue;if(g==='revenu'){inc+=o.a;continue}if(g==='epargne'){sav-=o.a;continue}dep-=o.a;by[o.c]=(by[o.c]||0)-o.a}
 return{ops,by,inc,dep,sav}}
function renderHist(){const ix=linkIndex();if(!histMonth)histMonth=today().slice(0,7);
 const[y,m]=histMonth.split('-').map(Number);const prev=m===1?(y-1)+'-12':y+'-'+pad(m-1),next=m===12?(y+1)+'-01':y+'-'+pad(m+1);
 const D=monthData(histMonth,ix),P=monthData(prev,ix);
 const keys=[...new Set([...Object.keys(D.by),...Object.keys(P.by)])].filter(k=>Math.abs(D.by[k]||0)>.5||Math.abs(P.by[k]||0)>.5).sort((a,b)=>(D.by[b]||0)-(D.by[a]||0));
 const mx=Math.max(1,...keys.map(k=>Math.max(D.by[k]||0,P.by[k]||0)));
 const dl=(a,b)=>{const x=a-b;if(Math.abs(x)<1)return'<span class="delta mut">=</span>';return`<span class="delta ${x>0?'up':'dn'}">${x>0?'▲ +':'▼ '}${eur0(x)}</span>`};
 const dlI=(a,b)=>{const x=a-b;if(Math.abs(x)<1)return'<span class="delta mut">=</span>';return`<span class="delta ${x<0?'up':'dn'}">${x>0?'▲ +':'▼ '}${eur0(x)}</span>`};
 const ops=D.ops.slice().sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:0);let lastD='',list='';
 for(const o of ops){if(o.d!==lastD){list+=`<div class="day">${fday(o.d)}</div>`;lastD=o.d}const c=cat(o.c);
  const lbl=o.t?(o.t.n||o.t.l||c.name):o.auto.it.name;
  list+=`<div class="li" ${o.t?`data-id="${o.t.id}"`:''}><div class="e">${c.emoji}</div><div class="m"><div>${esc(lbl)}</div><div class="sm mut">${esc(c.name)}${o.auto?' · prélèvement prévu':''}${o.t&&o.t.s==='m'?' · saisie':''}${o.t&&o.t.n&&o.t.l?' · '+esc(o.t.l):''}</div></div><div class="${o.a>0?'amt-pos':'amt-neg'}">${o.a>0?'+':''}${eur(o.a)}</div></div>`}
 $('#view').innerHTML=`<div class="monthnav"><button id="mPrev">‹</button><h1 style="text-transform:capitalize">${MOIS[m-1]} ${y}</h1><button id="mNext">›</button></div>
 <div class="kpis"><div><span class="sm mut">Revenus</span><b>${eur0(D.inc)}</b>${dlI(D.inc,P.inc)}</div>
 <div><span class="sm mut">Dépenses</span><b>${eur0(D.dep)}</b>${dl(D.dep,P.dep)}</div>

 const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000)}
$('#fileJson').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const o=JSON.parse(await f.text());if(!o||!Array.isArray(o.tx)||!o.settings)throw new Error('Ce fichier n\'est pas une sauvegarde de l\'app.');
  if(S&&!o.starter&&!confirm('Remplacer toutes les données actuelles par cette sauvegarde ?'))return;
  if(!o.cats)o.cats=JSON.parse(JSON.stringify(DEFAULT_CATS));if(!o.rules)o.rules={};if(!o.goal)o.goal=freshState().goal;
  S=o;if(S.starter){if(S.settings.balance&&!S.settings.balance.ts)S.settings.balance.ts=Date.now();relinkAll();buildRules();delete S.starter}
  save();tab='home';render();toast(`✓ ${S.tx.length} opérations chargées`)}catch(err){alert('Import impossible : '+err.message)}};
function buildRules(){const cnt={};for(const t of S.tx){if(!t.l||t.f)continue;const k=rkey(t.l);if(!k)continue;(cnt[k]=cnt[k]||{})[t.c]=(cnt[k][t.c]||0)+1}
 for(const k in cnt)S.rules[k]=Object.entries(cnt[k]).sort((a,b)=>b[1]-a[1])[0][0]}

/* ============ Import relevé bancaire ============ */
function parseCSV(txt){txt=txt.replace(/^﻿/,'');const first=txt.split(/\r?\n/).find(l=>l.trim())||'';
 const sep=[';','\t',','].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
 const rows=[];let row=[],cell='',q=false;
 for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
  else if(ch==='"')q=true;else if(ch===sep){row.push(cell);cell=''}
  else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&txt[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}
  else cell+=ch}
 if(cell||row.length){row.push(cell);rows.push(row)}return rows}
function loadXLSX(){return window.XLSX?Promise.resolve():new Promise((ok,ko)=>{const s=document.createElement('script');s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';s.onload=ok;s.onerror=()=>ko(new Error('Lecture Excel indisponible hors ligne. Exporte plutôt en CSV depuis ta banque.'));document.head.appendChild(s)})}
async function readBankFile(f){if(/\.xlsx?$/i.test(f.name)){await loadXLSX();const wb=XLSX.read(await f.arrayBuffer(),{type:'array'});return XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,dateNF:'dd/mm/yyyy',defval:''})}
 const buf=await f.arrayBuffer();let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('\uFFFD'))txt=new TextDecoder('windows-1252').decode(buf);return parseCSV(txt)}
const nh=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z ]/g,' ').replace(/\s+/g,' ').trim();
function pdate(v){v=String(v||'').trim();let m=v.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})/);if(m){let y=+m[3];if(y<100)y+=2000;return y+'-'+pad(m[2])+'-'+pad(m[1])}
 m=v.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];return null}
function rowsToOps(rows){const hi=rows.findIndex(r=>{const h=r.map(nh);return h.some(x=>x.includes('date'))&&h.some(x=>/debit|credit|montant/.test(x))});
 if(hi<0)throw new Error('Colonnes Date / Débit / Crédit introuvables.');
 const H=rows[hi].map(nh),find=(...ns)=>{for(const n of ns){const i=H.findIndex(h=>h===n);if(i>=0)return i}for(const n of ns){const i=H.findIndex(h=>h.includes(n));if(i>=0)return i}return -1};
 const iD=find('date operation','date de comptabilisation','date'),iL=find('libelle simplifie','libelle','libelle operation'),iX=find('libelle operation'),
  iI=find('informations complementaires','detail'),iR=find('reference','numero d operation'),iC=H.findIndex(h=>h==='categorie'),iS=H.findIndex(h=>h==='sous categorie'),
  iDe=find('debit'),iCr=find('credit'),iM=find('montant');
 const ops=[],cnt={};
 for(const r of rows.slice(hi+1)){const d=pdate(r[iD]);if(!d)continue;let a;
  if(iDe>=0||iCr>=0){const de=iDe>=0?num(r[iDe]):0,cr=iCr>=0?num(r[iCr]):0;a=(de?-Math.abs(de):0)+(cr?Math.abs(cr):0)}else a=num(r[iM]);
  a=Math.round(a*100)/100;if(!a)continue;
  const l=String(r[iL]??'').trim(),x=iX>=0&&iX!==iL?String(r[iX]??'').trim():'',ref=iR>=0?String(r[iR]??'').trim():'';
  let k=ref;if(!k){const kk=`${d}|${a.toFixed(2)}|${l}`;const n=cnt[kk]||0;cnt[kk]=n+1;k=kk+'|'+n}
  ops.push({d,a,l,x:x!==l?x:'',info:iI>=0?String(r[iI]??''):'',k,bc:iC>=0?String(r[iC]||''):'',bs:iS>=0?String(r[iS]||''):''})}
 return ops}
function bankCat(o){const L=(o.l+' '+o.x+' '+o.info).toUpperCase(),bs=o.bs,bc=o.bc,a=o.a;
 if(bs==='Virement interne'||/VIREMENT VERS M CHESNAY|^REMONTE|REVOLUT/.test(L))return'interne';
 if(/AMUNDI|DEPOT DE GARANTIE|HONORAIRE AGENCE/.test(L))return'exceptionnel';
 if(bs==='Salaires')return'revenus';
 if(/LOYER/.test(L)||bs==='Loyers et traites'||/^Energie/.test(bs)||(/EDF/.test(L)&&a<0)||/Travaux|Ameublement/.test(bs))return'logement';
 if(/COFIDIS/.test(L)||bc.startsWith('Credit'))return'credit';
 if(/ABEILLE/.test(L))return'av';
 if(/COM CB INT/.test(L)||/COTISATION/.test(L)||bs==='Frais bancaires')return'banque';
 if(/\bAMV\b|MACIF|ASSURANCE/.test(L)||(bc==='Banque et assurances'&&a<0))return'assurances';
 if(/ORANGE SA|BASIC FIT|APPLE\.COM|ANTHROPIC|CLAUDE\.AI|FULLI|PRLV PAYPAL|NETFLIX|SPOTIFY|DEEZER|DISNEY|CANAL\+|SFR|FREE MOBILE|BOUYGUES/.test(L)||/Internet et telephonie|Video, Musique/.test(bs))return'abonnements';
 if(/NYX|VAPOT/.test(L)||bs==='Tabac-Presse')return'cafe';
 if(bs==='Bar')return'bars';
 if(/UBER EATS|DELIVEROO|JUST EAT/.test(L)||/Restaurant|Restauration/.test(bs))return'restos';
 if(/Hyper|Alimentation/.test(bs)||bc==='Alimentation')return'courses';
 if(bc==='Transports'||/JCDECAUX|PAYBYPHONE|AMIENS METRO|CONTROLE TECHN/.test(L))return'transport';
 if(bc==='Sante'||/Coiffeurs|Remboursements de soins|Mutuelle/.test(bs))return a>0&&bs==='Mutuelle'?'revenus':'sante';
 if(bc==='Loisirs et vacances')return'loisirs';
 if(bc.startsWith('Impots'))return'impots';
 if(bc==='Shopping et services'||/VINTED|AMAZON/.test(L))return'shopping';
 return a>0?'revenus':'divers'}
$('#fileBank').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
 try{const ops=rowsToOps(await readBankFile(f));const have=new Set(S.tx.map(t=>t.k).filter(Boolean));const added=[],review=[];let merged=0;
  const valid=id=>S.cats.some(c=>c.id===id);
  for(const o of ops){if(have.has(o.k))continue;have.add(o.k);
   const t={id:uid(),k:o.k,d:o.d,a:o.a,l:o.l,s:'b'};if(o.x)t.x=o.x;
   const m=S.tx.find(x=>x.s==='m'&&!x.mg&&Math.abs(x.a-o.a)<.01&&Math.abs(diffD(x.d,o.d))<=4);
   if(m){t.c=m.c;t.uc=1;if(m.n)t.n=m.n;S.rules[rkey(o.l)]=m.c;S.tx=S.tx.filter(x=>x!==m);merged++}
   else{const rc=S.rules[rkey(o.l)];if(rc&&valid(rc))t.c=rc;else{t.c=bankCat(o);if(!valid(t.c))t.c=o.a>0?'revenus':'divers';t.auto=1}}
   linkTx(t);if(t.f)delete t.auto;S.tx.push(t);added.push(t);if(t.auto)review.push(t)}
  save();render();openImportReview(added.length,merged,review,ops.length)}catch(err){alert('Import impossible : '+err.message)}};
function openImportReview(n,merged,review,total){const sh=$('#sheet');
 const draw=()=>{sh.innerHTML=`<div class="addwrap"><div class="top"><span></span><h2 style="margin:0">Import terminé</h2><button class="x" data-a="close">✕</button></div>
 <div class="card"><b>${n}</b> nouvelles opérations sur ${total} lues<br><span class="mut sm">${total-n} déjà connues · ${merged} rapprochées de tes saisies</span></div>
 ${review.length?`<h2>À vérifier (${review.length})</h2><p class="sm mut">Catégorie devinée. Touche l'emoji pour corriger : l'app s'en souviendra.</p>
 ${review.map((t,i)=>`<div class="li"><button class="x" style="font-size:22px" data-r="${i}">${cat(t.c).emoji}</button><div class="m"><div>${esc(t.l)}</div><div class="sm mut">${fdate(t.d)} · ${esc(cat(t.c).name)}</div></div><div class="${t.a>0?'amt-pos':'amt-neg'}">${eur(t.a)}</div></div>`).join('')}`:'<p class="mut">Tout a été catégorisé automatiquement ✓</p>'}
 <button class="btn" data-a="close">Valider</button></div>`};
 draw();sh.classList.remove('hidden');document.body.style.overflow='hidden';
 sh.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.a==='close'){review.forEach(t=>delete t.auto);save();closeSheet();render();return}
  if(b.dataset.r!=null){const t=review[+b.dataset.r];pickCat(t.c,c=>{t.c=c;t.uc=1;const k=rkey(t.l);S.rules[k]=c;review.forEach(x=>{if(rkey(x.l)===k){x.c=c;x.uc=1}});save();draw()})}}}
function pickCat(cur,cb){const ov=document.createElement('div');ov.className='sheet';ov.style.zIndex=15;
 ov.innerHTML=`<div class="addwrap"><div class="top"><span></span><h2 style="margin:0">Catégorie</h2><button class="x">✕</button></div><div class="cats" style="margin-top:12px">${S.cats.map(c=>`<button data-c="${c.id}" class="${c.id===cur?'sel':''}"><span>${c.emoji}</span>${esc(c.name)}</button>`).join('')}</div></div>`;
 document.body.appendChild(ov);ov.onclick=e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.c)cb(b.dataset.c);ov.remove()}}

/* ============ Démarrage ============ */
load();render();
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S&&$('#sheet').classList.contains('hidden'))render()});
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
</script>
